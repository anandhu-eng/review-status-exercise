name: checks
on: [push, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Database reachable
        run: |
          curl -sf "https://mpgyuiepgsevezlivlxp.supabase.co/rest/v1/submissions?select=id" \
            -H "apikey: sb_publishable_hBLhTOAw_B4-2Lf_Q4pQgw_TThlpjJe" | python3 -c "import json,sys; print(len(json.load(sys.stdin)), 'submissions')"
      - name: Build (if build.sh exists)
        run: if [ -f build.sh ]; then bash build.sh; fi
      - name: Run checks
        run: |
          pip install -q pytest
          pytest -v tests
